# The Review Council gate (epic IO-12475, sections 4.1, 9 and 11; IO-12484).
#
# Harness dispatches this workflow for one pull request head once the
# advisory gate status has converged. The job's OIDC token — this file, on the
# protected default branch, allow-listed by exact path in the organization's
# review settings — is what `rcl review --attest` exchanges for a run-bound
# Harness credential, so the round it records is *attested* and drives the
# `Review Council` check run and the enforced gate.
#
# Nothing here checks out the pull request or holds a provider secret: rcl
# reads the pull request through the GitHub API and fetches model keys from
# Harness under the run-bound credential. The inputs reach the shell through
# the environment, never by expression interpolation into a command line.
# harness-review-lifecycle: 1
# This marker promises the optional attempt_id input and exact run-name below.
name: Review Council gate
run-name: Review Council gate · ${{ inputs.attempt_id || 'unregistered' }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number the attested round reviews
        required: true
        type: string
      head_sha:
        description: Head commit the round must find on the pull request (the review fails fast otherwise)
        required: true
        type: string

      attempt_id:
        description: Harness dispatch attempt UUID (omit only for an unregistered manual run)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: review-gate-${{ inputs.pr_number }}-${{ inputs.head_sha }}
  cancel-in-progress: false

jobs:
  attested-review:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    env:
      HARNESS_API_URL: https://harness.infra.one
    steps:
      # The workflow's own commit on the default branch — the installer
      # script lives here; the pull request is never checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install Review Council
        run: |
          # Same private-prefix install as review.yml: the hosted toolcache is
          # world-writable by design, which the installer refuses as a prefix.
          umask 077
          TOOLCACHE_PREFIX="$(dirname "$(dirname "$(command -v npm)")")"
          RUNTIME_PREFIX="$(mktemp -d "$RUNNER_TEMP/rcl-runtime.XXXXXX")"
          cp -R "$TOOLCACHE_PREFIX"/. "$RUNTIME_PREFIX"/
          python3 scripts/install_latest_rcl.py \
            --npm-bin "$RUNTIME_PREFIX/bin/npm" \
            --node-bin "$RUNTIME_PREFIX/bin/node" \
            --approved-prefix "$RUNTIME_PREFIX"
          echo "$RUNTIME_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Attested review
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          ATTEMPT_ID: ${{ inputs.attempt_id }}
          # The runner context is valid only from step level down; at job
          # level `env` the workflow fails to parse (RCL-67 regression).
          RCL_DATA_DIR: ${{ runner.temp }}/rcl-gate-data
          RCL_GATE_EXPORT: ${{ runner.temp }}/rcl-gate-evidence
        run: |
          case "$PR_NUMBER" in
            ''|*[!0-9]*) echo "pr_number must be a pull request number, got: $PR_NUMBER" >&2; exit 2 ;;
          esac
          case "$HEAD_SHA" in
            *[!0-9a-f]*|'') echo "head_sha must be a full lowercase commit id" >&2; exit 2 ;;
          esac
          if [ "${#HEAD_SHA}" -ne 40 ]; then
            echo "head_sha must be 40 hex characters, got ${#HEAD_SHA}" >&2
            exit 2
          fi
          if [ -n "$ATTEMPT_ID" ] && ! printf '%s\n' "$ATTEMPT_ID" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "attempt_id must be a lowercase UUID when provided" >&2
            exit 2
          fi
          umask 077
          mkdir -p "$RCL_GATE_EXPORT" "$RCL_DATA_DIR"
          python3 - <<'PYMANIFEST'
          import json, os
          from pathlib import Path
          keys = ["GITHUB_REPOSITORY", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_SHA", "PR_NUMBER", "HEAD_SHA", "ATTEMPT_ID"]
          Path(os.environ["RCL_GATE_EXPORT"], "workflow.json").write_text(json.dumps({k: os.environ.get(k) for k in keys}, sort_keys=True) + "\n")
          PYMANIFEST
          rcl review "$GITHUB_REPOSITORY#$PR_NUMBER" \
            --attest \
            --expect-head-sha "$HEAD_SHA" \
            --evidence-required \
            --json-file "$RCL_GATE_EXPORT/report.json" \
            --markdown "$RCL_GATE_EXPORT/report.md" \
            --ci

      # Private GitHub artifacts retain originals even when delivery/health fails.
      # Abrupt runner loss before serialization/export remains an unavailable window.
      - name: Retain original review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rcl-gate-evidence/
            ${{ runner.temp }}/rcl-gate-data/quarantine/
          if-no-files-found: warn
          retention-days: 30
