name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - name: Tag must match package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $PKG — refusing to publish"
            exit 1
          fi
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run
      - run: npm publish --access public
