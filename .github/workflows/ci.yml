name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Test packed historical reconciliation CLI
        shell: bash
        run: |
          PACK_DIR=$(mktemp -d)
          INSTALL_DIR=$(mktemp -d)
          npm pack --pack-destination "$PACK_DIR"
          shopt -s nullglob
          packages=("$PACK_DIR"/allocator-one-rcl-*.tgz)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "expected exactly one package artifact, found ${#packages[@]}"
            exit 1
          fi
          npm install --prefix "$INSTALL_DIR" --ignore-scripts --no-audit --no-fund "${packages[0]}"
          RCL_HISTORICAL_PACKED_CLI="$INSTALL_DIR/node_modules/.bin/rcl" \
            npm test -- --maxWorkers=1 test/converge/historical-delivery-reconciliation.test.ts \
              -t "previews and applies through the supported CLI with GET-only server access"
      - run: npm pack --dry-run
